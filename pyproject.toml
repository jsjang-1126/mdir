[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mdir"
version = "0.1.0"
description = "Terminal file explorer built with Textual"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "textual>=0.80.0",
    "rich>=13.0.0",
]

[project.scripts]
mdir = "mdir.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mdir*"]

[tool.setuptools.package-data]
mdir = ["*.tcss"]
